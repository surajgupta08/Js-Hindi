<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Scheme Switcher</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="canvas">
      <h1>Color Scheme Switcher</h1>
      <span class="buttons" id="grey"></span>
      <span class="buttons" id="white"></span>
      <span class="buttons" id="blue"></span>
      <span class="buttons" id="yellow"></span>

      <h2>
        Try clicking on one of the above box
        <span>to change the background color of these page!</span>
      </h2>
    </div>
  </body>
  <script src="index.js"></script>
</html>
